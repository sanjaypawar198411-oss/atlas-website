<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="arcCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#78e4ff" />
      <stop offset="70%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="arcCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#02040a" stop-opacity="0" />
    </radialGradient>
    <filter id="arcFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Outer Ring -->
  <circle cx="200" cy="200" r="185" fill="rgba(2, 6, 16, 0.85)" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="200" cy="200" r="170" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12 6" opacity="0.7" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="#00f0ff" stroke-width="8" opacity="0.8" filter="url(#arcFilter)" />
  
  <!-- 10 Magnetic Energy Coils -->
  <g transform="translate(200, 200)">
    <rect x="-10" y="-148" width="20" height="32" rx="3" fill="#00f0ff" opacity="0.9" transform="rotate(0)" filter="url(#arcFilter)" />
    <rect x="-7" y="-145" width="14" height="26" rx="2" fill="#ffffff" transform="rotate(0)" />
    <rect x="-10" y="-148" width="20" height="32" rx="3" fill="#00f0ff" opacity="0.9" transform="rotate(36)" filter="url(#arcFilter)" />
    <rect x="-7" y="-145" width="14" height="26" rx="2" fill="#ffffff" transform="rotate(36)" />
    <rect x="-10" y="-148" width="20" height="32" rx="3" fill="#00f0ff" opacity="0.9" transform="rotate(72)" filter="url(#arcFilter)" />
    <rect x="-7" y="-145" width="14" height="26" rx="2" fill="#ffffff" transform="rotate(72)" />
    <rect x="-10" y="-148" width="20" height="32" rx="3" fill="#00f0ff" opacity="0.9" transform="rotate(108)" filter="url(#arcFilter)" />
    <rect x="-7" y="-145" width="14" height="26" rx="2" fill="#ffffff" transform="rotate(108)" />
    <rect x="-10" y="-148" width="20" height="32" rx="3" fill="#00f0ff" opacity="0.9" transform="rotate(144)" filter="url(#arcFilter)" />
    <rect x="-7" y="-145" width="14" height="26" rx="2" fill="#ffffff" transform="rotate(144)" />
    <rect x="-10" y="-148" width="20" height="32" rx="3" fill="#00f0ff" opacity="0.9" transform="rotate(180)" filter="url(#arcFilter)" />
    <rect x="-7" y="-145" width="14" height="26" rx="2" fill="#ffffff" transform="rotate(180)" />
    <rect x="-10" y="-148" width="20" height="32" rx="3" fill="#00f0ff" opacity="0.9" transform="rotate(216)" filter="url(#arcFilter)" />
    <rect x="-7" y="-145" width="14" height="26" rx="2" fill="#ffffff" transform="rotate(216)" />
    <rect x="-10" y="-148" width="20" height="32" rx="3" fill="#00f0ff" opacity="0.9" transform="rotate(252)" filter="url(#arcFilter)" />
    <rect x="-7" y="-145" width="14" height="26" rx="2" fill="#ffffff" transform="rotate(252)" />
    <rect x="-10" y="-148" width="20" height="32" rx="3" fill="#00f0ff" opacity="0.9" transform="rotate(288)" filter="url(#arcFilter)" />
    <rect x="-7" y="-145" width="14" height="26" rx="2" fill="#ffffff" transform="rotate(288)" />
    <rect x="-10" y="-148" width="20" height="32" rx="3" fill="#00f0ff" opacity="0.9" transform="rotate(324)" filter="url(#arcFilter)" />
    <rect x="-7" y="-145" width="14" height="26" rx="2" fill="#ffffff" transform="rotate(324)" />
  </g>

  <!-- Inner High-Velocity Confinement Ring -->
  <circle cx="200" cy="200" r="105" fill="none" stroke="#78e4ff" stroke-width="5" stroke-dasharray="30 10 5 10" opacity="0.85" />
  <circle cx="200" cy="200" r="85" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6" stroke-dasharray="8 8" />

  <!-- Center Core Plasma Glow -->
  <circle cx="200" cy="200" r="70" fill="url(#arcCoreGlow)" />
  <circle cx="200" cy="200" r="42" fill="url(#arcCoreGrad)" filter="url(#arcFilter)" />
  <circle cx="200" cy="200" r="24" fill="#ffffff" />
</svg>