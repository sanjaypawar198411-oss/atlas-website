<script>
(function(){
  var DL = '/Victor-AI-Setup-3.1.15.exe';
  function startDownload(){
    var a = document.createElement('a');
    a.href = DL;
    a.download = 'Victor-AI-Setup-3.1.15.exe';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ try { document.body.removeChild(a); } catch(e){} }, 500);
  }
  document.addEventListener('click', function(e){
    var el = e.target.closest('a, button');
    if (!el) return;
    var t = (el.textContent || '').trim();
    var isDlAction = /download\s*(now|for\s*windows)/i.test(t) || el.classList.contains('download-btn');
    if (isDlAction) {
      e.preventDefault();
      e.stopPropagation();
      startDownload();
    }
  }, true);
})();
</script>
